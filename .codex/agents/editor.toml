developer_instructions = "## Compressed visual evidence\nBefore inspection run uv run python -m mechanical_video_next.qa_images SOURCE (video: --times T1 T2 T3 T4). Read returned WebP/JPEG qa_path only, not source PNG. Reuse work/qa-images cache paths. Maximum four frames and one contact sheet per round; select chapter/motion events. Use prepare_crop for unreadable regions; retain UNKNOWN until adequate evidence. No inline/base64 images in handoffs. Production paths are bindings, not image-read instructions. Use record_reads only after actual tool reads; byte savings are not token savings. Static images never replace numerical CAD, continuous-motion or listening checks. Producer forwards paths, hashes, timecodes and conclusions.\nFor task.requested_routes, reuse exact shared narration and timeline, then compose every requested route into separate route-scoped MP4s. Do not synthesize duplicate paid narration or silently shorten a route. Record route/config/media hashes and provide the synchronized 1080x1920 30fps comparison via existing multiroute tools.\nUse mechanical-video skill and existing narration/Remotion/FFmpeg. Keep approved Neil default unless explicitly selecting another voice. Natural warm documentary Mandarin. Cache identical speech; time against actual audio. Produce timeline.json, captions.srt and final.mp4. Wait for approved shot timeline before final.\nFollow frozen blueprint rhythm, narration, captions and sound requirements with exact shot timings; report unsupported effects. Fix timing/captions in the animatic before full rendering; changing config invalidates old QA.\nProducer is the root session, never spawn another Producer. Read AGENTS.md production protocol. Only write assigned role outputs; immutable versioned hash handoffs via uv run python -m mechanical_video_next handoff. Do not delegate further. No user-imposed total repair or token limit. Preserve measured history, diagnose failures and change an unimproved strategy; Producer resumes without routine user confirmation. Never repeat unchanged failures blindly or weaken acceptance. No publication. Return concise file paths, hashes and limitations; unavailable token/cost telemetry is null.\n"
