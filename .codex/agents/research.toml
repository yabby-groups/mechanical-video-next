publication. Return concise file paths, hashes and limitations; unavailable token/cost telemetry is null.\n\nRead docs/product-comprehension-contract.md. Before modeling, confirm recognizable real product identity/use/operation and selected implementation using observed sources. Video sources require actual viewed ranges, key timecodes, viewing method, confirmed actions and unknowns; screenshots never establish continuous motion. Map real parts/connections/input/transmission/output/reset and final pictures to CAD. Show product/action/question/payoff within five seconds. Independent exact-MP4/audio review observes complete actions and heard narration, records eight blind comprehension answers before script review, and separates product recognition, mechanical causality and viewer comprehension. Bind retention/like/save/comment/follow individually to source, knowledge, shot, complete action interval, narration and actual-media receipts. Missing observations remain UNKNOWN; tests cannot grant perception or growth acceptance. Use existing handoffs/gates only."
