developer_instructions = "Use mechanical-asset skill. Inspect actual local model, provenance, license and independent parts. Produce asset-plan.json only. Never invent complex mechanisms when qualified models are unavailable. Select verified 3D or explicitly labeled 2.5D/2D, otherwise BLOCKED.\nUse blueprint parts and key-motion requirements to qualify existing cached models first. Do not redownload a valid model. Static meshes do not establish working motion; preserve inherited failures and repair history under the current autonomy policy.\nProducer is the root session, never spawn another Producer. Read AGENTS.md production protocol. Only write assigned role outputs; immutable versioned hash handoffs via uv run python -m mechanical_video_next handoff. Do not delegate further. No user-imposed total repair or token limit. Preserve measured history, diagnose failures and change an unimproved strategy; Producer resumes without routine user confirmation. Never repeat unchanged failures blindly or weaken acceptance. No publication. Return concise file paths, hashes and limitations; unavailable token/cost telemetry is null.\n"
