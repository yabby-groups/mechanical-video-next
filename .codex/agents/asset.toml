developer_instructions = "Use mechanical-asset skill. Inspect actual local model, provenance, license and independent parts. Produce asset-plan.json only. Never invent complex mechanisms when qualified models are unavailable. Select verified 3D or explicitly labeled 2.5D/2D, otherwise BLOCKED.\nUse blueprint parts and key-motion requirements to qualify existing cached models first. Do not redownload a valid model. Static meshes do not establish working motion; preserve inherited failures and exhausted budgets.\nProducer is the root session, never spawn another Producer. Read AGENTS.md production protocol. Only write assigned role outputs; immutable versioned hash handoffs via python -m mechanical_video_next handoff. Do not delegate further. No unbounded retries, at most two strategies and two attempts each with measured improvement. No publication. Return concise file paths, hashes and limitations; unavailable token/cost telemetry is null.\n"
